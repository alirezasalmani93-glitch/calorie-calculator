<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>نیروانا | محاسبه کالری</title>

<style>

*{
box-sizing:border-box;
font-family:Tahoma,Arial,sans-serif;
}

body{
margin:0;
background:#f3f6f4;
color:#222;
}

.container{
max-width:520px;
margin:auto;
padding:18px;
}

.card{
background:#fff;
border-radius:22px;
padding:22px;
box-shadow:0 5px 25px rgba(0,0,0,.08);
}

.logo{
text-align:center;
font-size:35px;
}

.brand{
text-align:center;
font-size:27px;
font-weight:bold;
margin-top:5px;
}

.subtitle{
text-align:center;
color:#777;
font-size:13px;
line-height:1.8;
margin:8px 0 25px;
}

label{
display:block;
font-weight:bold;
margin-top:17px;
margin-bottom:7px;
}

input,
select{
width:100%;
padding:14px;
border:1px solid #ddd;
border-radius:12px;
font-size:16px;
background:#fff;
}

.gender{
display:flex;
gap:10px;
}

.gender label{
margin:0;
flex:1;
}

.gender input{
display:none;
}

.gender span{
display:block;
text-align:center;
padding:14px;
border:2px solid #ddd;
border-radius:12px;
cursor:pointer;
font-size:16px;
}

.gender input:checked + span{
border-color:#278a5b;
background:#edf8f1;
}

.calculate{
width:100%;
margin-top:25px;
padding:16px;
border:0;
border-radius:14px;
background:#278a5b;
color:white;
font-size:18px;
font-weight:bold;
cursor:pointer;
}

#result{
display:none;
margin-top:25px;
}

.title{
text-align:center;
font-size:21px;
font-weight:bold;
margin-bottom:15px;
}

.box{
background:#f6f8f7;
border-radius:14px;
padding:15px;
margin-bottom:10px;
}

.box strong{
display:block;
font-size:21px;
margin-top:6px;
}

.main{
background:#edf8f1;
border:1px solid #d5eddf;
}

.small{
font-size:13px;
color:#777;
margin-top:5px;
line-height:1.7;
}

.warning{
margin-top:18px;
padding:13px;
border-radius:12px;
background:#fff8e5;
color:#665500;
font-size:12px;
line-height:2;
}

.reset{
width:100%;
padding:13px;
margin-top:10px;
border:1px solid #ddd;
border-radius:12px;
background:#fff;
font-size:15px;
}

.footer{
text-align:center;
font-size:11px;
color:#999;
margin-top:18px;
}

</style>

</head>


<body>

<div class="container">

<div class="card">

<div class="logo">🌿</div>

<div class="brand">نیروانا</div>

<div class="subtitle">

محاسبه‌گر هوشمند کالری روزانه

<br>

نیاز تقریبی انرژی بدن خود را محاسبه کنید.

</div>


<form id="calorieForm">


<label>جنسیت</label>

<div class="gender">

<label>

<input
type="radio"
name="gender"
value="male">

<span>👨 مرد</span>

</label>


<label>

<input
type="radio"
name="gender"
value="female">

<span>👩 زن</span>

</label>

</div>


<label for="age">
سن
</label>

<input
id="age"
type="number"
min="15"
max="100"
placeholder="مثلاً 35"
required>

قد (سانتی‌متر
